<section class="search-section" id="buscar">
    <div class="container">

        <div class="section-header">
            <span class="section-tag">Explora</span>
            <h2>Encuentra tu próxima oportunidad</h2>
            <p>
                Busca oportunidades según tus intereses y habilidades.
            </p>
        </div>

        <div class="search-box">

            <div class="search-field">
                <label>¿Qué estás buscando?</label>

                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Ej. Desarrollador Web"
                    >
                </div>
            </div>

            <div class="search-field">
                <label>Ubicación</label>

                <div class="input-wrapper">
                    <i class="fa-solid fa-location-dot"></i>
                    <select id="locationInput">
                        <option value="">Cualquier ubicación</option>
                        <option value="Puebla">Puebla</option>
                        <option value="CDMX">Ciudad de México</option>
                        <option value="Remoto">Remoto</option>
                    </select>
                </div>
            </div>

            <button class="search-button" id="searchButton">
                <i class="fa-solid fa-magnifying-glass"></i>
                Buscar oportunidades
            </button>

        </div>

        <p id="searchMessage" class="search-message"></p>

    </div>
</section>
